name: Backup D1 Database (encrypted)
permissions:
  contents: read
on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/backup-d1.yaml
      - scripts/backup-d1.sh
      - scripts/validate-backup.py
      - docs/backup-recipient.pem
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to back up
        required: true
        default: production
        type: choice
        options: [production, dev]
concurrency:
  group: d1-backup-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  backup:
    name: Export, validate, encrypt and retain D1 backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID_PRODUCTION: ${{ secrets.D1_DATABASE_ID }}
      D1_DATABASE_ID_DEV: ${{ secrets.D1_DATABASE_ID_DEV }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - name: Install pinned Wrangler
        run: npm install -g wrangler@4.82.1
      - name: Export, restore-check and encrypt
        run: bash scripts/backup-d1.sh
      - name: Save encrypted backup (required)
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: warden-d1-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: |
            backup-output/*.cms
            backup-output/SHA256SUMS
            backup-output/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Confirm retained artifact
        env:
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "Encrypted backup retained as artifact $ARTIFACT_ID (30 days)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove plaintext on failure too
        if: always()
        run: rm -f backup.sql backup.sql.gz backup-restore.sqlite
